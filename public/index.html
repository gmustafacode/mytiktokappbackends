<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok OAuth Test</title>
</head>

<body>
    <h1>TikTok OAuth + Posting Demo</h1>
    <p><a href="/auth/tiktok">Connect TikTok</a></p>

    <h2>Publish video</h2>
    <form action="/tiktok/post" method="POST" enctype="multipart/form-data">
        <label>
            Video file:<br />
            <input type="file" name="video" accept="video/mp4,video/quicktime,video/webm" required />
        </label>
        <br /><br />
        <label>
            Title:<br />
            <input type="text" name="title" value="My TikTok video" />
        </label>
        <br /><br />
        <button type="submit">Publish</button>
    </form>
</body>

</html>
